<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Esharah Fashion Ltd - Consumption Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eceff1; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        .header { text-align: center; border-bottom: 3px solid #00acc1; margin-bottom: 20px; padding-bottom: 10px; }
        .logo-text { font-size: 1.8em; font-weight: bold; color: #1a237e; letter-spacing: 1px; text-transform: uppercase; }
        .sub-header { color: #00acc1; font-weight: bold; font-size: 0.9em; margin-top: 5px; }

        h3 { font-size: 1.1em; color: #546e7a; margin: 15px 0 10px 0; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #455a64; }
        
        input, select { padding: 8px; border: 1px solid #cfd8dc; border-radius: 4px; box-sizing: border-box; }
        .unit-selector { width: 100%; background: #e1f5fe; font-weight: bold; margin-bottom: 15px; border: 2px solid #00acc1; color: #01579b; }
        
        .btn-add { background: #00acc1; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-remove { background: #ff5252; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-toggle { background: #455a64; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; }
        .btn-print { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; }
        
        .result-box { background: #e0f7fa; padding: 20px; border-radius: 8px; border-left: 6px solid #00acc1; margin-top: 15px; }
        .res-line { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        .highlight { font-size: 1.5em; font-weight: bold; color: #007c91; }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        #avg-section { display: none; background: #fafafa; border: 1px solid #d1d1d1; padding: 15px; border-radius: 8px; }
        .avg-table { width: 100%; border-collapse: collapse; }
        
        /* Print Specific Styles */
        @media print {
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .btn-add, .btn-remove, .btn-toggle, .btn-print, .unit-selector, .btn-remove { display: none !important; }
            input { border: none !important; background: transparent !important; }
            .section { border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-text">AL ESHARAH FASHION LTD</div>
        <div class="sub-header">Official Apparel Consumption Report</div>
    </div>

    <div class="section">
        <label>Input Unit:</label>
        <select id="globalUnit" class="unit-selector" onchange="calculate()">
            <option value="cm">Centimeters (cm)</option>
            <option value="meter">Meters (m)</option>
            <option value="inch">Inches (in)</option>
            <option value="yard">Yards (yd)</option>
        </select>
    </div>

    <div class="section">
        <h3>1. Component List</h3>
        <div id="component-container">
            <div class="input-row">
                <input type="text" value="Front Body" style="flex:2">
                <input type="number" class="comp-val" value="72" oninput="calculate()" style="flex:1">
                <span class="unit-text" style="width:40px; font-weight:bold;">cm</span>
                <div style="width:38px"></div>
            </div>
            <div class="input-row">
                <input type="text" value="Back Body" style="flex:2">
                <input type="number" class="comp-val" value="74" oninput="calculate()" style="flex:1">
                <span class="unit-text" style="width:40px; font-weight:bold;">cm</span>
                <div style="width:38px"></div>
            </div>
        </div>
        <button class="btn-add" onclick="addComponent()">+ Add Component</button>
    </div>

    <div class="section">
        <h3>2. Fabric Specifications</h3>
        <div class="grid-3">
            <div><label>Width (cm)</label><input type="number" id="width" value="160" style="width:100%" oninput="calculate()"></div>
            <div><label>GSM</label><input type="number" id="gsm" value="180" style="width:100%" oninput="calculate()"></div>
            <div><label>Wastage (%)</label><input type="number" id="wastage" value="15" style="width:100%" oninput="calculate()"></div>
        </div>
    </div>

    <button class="btn-toggle" onclick="toggleAvg()">Show Size Wise Table (Section 6)</button>
    <button class="btn-print" onclick="window.print()">Print This Report</button>

    <div id="avg-section">
        <h3>6. Size Wise Consumption Average</h3>
        <table class="avg-table">
            <tbody>
                <tr><td>S</td><td><input type="number" class="size-val" value="0.60" oninput="calculateAvg()" style="width:100%"></td></tr>
                <tr><td>M</td><td><input type="number" class="size-val" value="0.65" oninput="calculateAvg()" style="width:100%"></td></tr>
                <tr><td>L</td><td><input type="number" class="size-val" value="0.70" oninput="calculateAvg()" style="width:100%"></td></tr>
                <tr><td>XL</td><td><input type="number" class="size-val" value="0.75" oninput="calculateAvg()" style="width:100%"></td></tr>
                <tr><td>XXL</td><td><input type="number" class="size-val" value="0.80" oninput="calculateAvg()" style="width:100%"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="result-box">
        <div id="single-display">
            <div class="res-line">
                <span>Total Length (<span class="unit-text">cm</span>):</span>
                <span id="displayTotalLength" style="font-weight:bold;">0.00</span>
            </div>
            <div class="res-line">
                <span>Total Consumption:</span>
                <span class="highlight"><span id="finalKg">0.0000</span> kg/pc</span>
            </div>
        </div>
        <div id="avg-display" style="display:none;">
            <div class="res-line">
                <span>Group Size Average:</span>
                <span class="highlight" style="color: #d32f2f;"><span id="avgResult">0.0000</span> kg/pc</span>
            </div>
        </div>
    </div>
</div>

<script>
const factors = { cm: 0.01, meter: 1, inch: 0.0254, yard: 0.9144 };

function toggleAvg() {
    const sec = document.getElementById('avg-section');
    const sDisp = document.getElementById('single-display');
    const aDisp = document.getElementById('avg-display');
    const btn = document.querySelector('.btn-toggle');
    if (sec.style.display === "none" || sec.style.display === "") {
        sec.style.display = "block"; aDisp.style.display = "block"; sDisp.style.display = "none";
        btn.innerText = "Switch to Single Calculation";
    } else {
        sec.style.display = "none"; aDisp.style.display = "none"; sDisp.style.display = "block";
        btn.innerText = "Show Size Wise Table (Section 6)";
    }
}

function addComponent() {
    const unit = document.getElementById('globalUnit').value;
    const container = document.getElementById('component-container');
    const div = document.createElement('div');
    div.className = 'input-row';
    div.innerHTML = `<input type="text" placeholder="Part" style="flex:2"><input type="number" class="comp-val" value="0" oninput="calculate()" style="flex:1"><span class="unit-text" style="width:40px; font-weight:bold;">${unit}</span><button class="btn-remove" onclick="removeComponent(this)">×</button>`;
    container.appendChild(div);
    calculate();
}

function removeComponent(btn) { btn.parentElement.remove(); calculate(); }

function calculate() {
    const unit = document.getElementById('globalUnit').value;
    const values = document.getElementsByClassName('comp-val');
    const unitLabels = document.getElementsByClassName('unit-text');
    let rawSum = 0;
    
    for (let label of unitLabels) { label.innerText = unit; }
    for (let i = 0; i < values.length; i++) { rawSum += parseFloat(values[i].value) || 0; }

    document.getElementById('displayTotalLength').innerText = rawSum.toFixed(3);
    let totalMeters = rawSum * factors[unit];

    const widthCm = parseFloat(document.getElementById('width').value) || 0;
    const gsm = parseFloat(document.getElementById('gsm').value) || 0;
    const wastage = parseFloat(document.getElementById('wastage').value) || 0;

    let base = (totalMeters * (widthCm / 100) * gsm) / 1000;
    let final = base + (base * (wastage/100));
    
    document.getElementById('finalKg').innerText = final.toFixed(4);
    calculateAvg();
}

function calculateAvg() {
    const values = document.getElementsByClassName('size-val');
    let total = 0;
    for (let i = 0; i < values.length; i++) { total += parseFloat(values[i].value) || 0; }
    document.getElementById('avgResult').innerText = (total / 5).toFixed(4);
}

calculate();
</script>
</body>
</html>
